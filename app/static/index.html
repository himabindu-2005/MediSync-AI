<script>
var D=null,page='overview',query='',currentUser=null;
var nativeFetch=window.fetch.bind(window);
window.fetch=function(input,options){options=options||{};var token=localStorage.getItem('medisyncToken');if(token){options.headers=new Headers(options.headers||{});if(!options.headers.has('Authorization'))options.headers.set('Authorization','Bearer '+token)}return nativeFetch(input,options)};
var rolePages={Admin:['overview','hospitals','inventory','addstock','forecast','shortages','expiry','redistribution','reorder','import','simulation','audit','users','blueprint'],'Hospital Manager':['overview','hospitals','inventory','addstock','forecast','shortages','expiry','redistribution','reorder','import','simulation','audit','blueprint'],Pharmacist:['overview','hospitals','inventory','forecast','shortages','expiry','redistribution','reorder','simulation','audit','blueprint'],Auditor:['overview','hospitals','inventory','forecast','shortages','expiry','redistribution','reorder','audit','blueprint']};
function applyRole(){var allowed=rolePages[currentUser.role]||[];document.querySelectorAll('.nav[data-page]').forEach(function(b){b.style.display=allowed.includes(b.dataset.page)?'flex':'none'});document.body.classList.remove('loggedout');document.getElementById('logoutBtn').style.display='inline-block';var initials=currentUser.display_name.split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase();document.getElementById('sideAvatar').textContent=initials;document.getElementById('topAvatar').textContent=initials;document.getElementById('sideIdentity').innerHTML=esc(currentUser.display_name)+'<small>'+esc(currentUser.role)+' · Local demo</small>'}
function renderLogin(){currentUser=null;document.body.classList.add('loggedout');document.getElementById('logoutBtn').style.display='none';document.getElementById('content').innerHTML='<div class="loginwrap"><section class="loginbrand"><div><div class="mark">✚</div><h1>MediSync AI</h1><p>Medicine availability planning across hospitals. Sign in to open the local demonstration workspace.</p></div><small>LOCAL MVP · Synthetic data</small></section><section class="loginform"><h2>Welcome back</h2><p>Use a demonstration account to continue.</p><form id="loginForm"><div class="field"><label>Username</label><input class="control" name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input class="control" name="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="loginerror"></div><button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button></form><div class="demoaccounts"><div class="demoaccount"><b>Admin</b> · admin / Admin@123</div><div class="demoaccount"><b>Hospital Manager</b> · manager / Manager@123</div><div class="demoaccount"><b>Pharmacist</b> · pharmacist / Pharma@123</div><div class="demoaccount"><b>Auditor (read only)</b> · auditor / Audit@123</div></div></section></div>';
document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();var f=new FormData(e.target);var out=document.getElementById('loginError');out.textContent='Signing in…';try{var r=await nativeFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});var j=await r.json();if(!r.ok)throw Error(j.detail||'Sign in failed');localStorage.setItem('medisyncToken',j.access_token);currentUser=j.user;page='overview';load()}catch(err){out.textContent=err.message}});
}
document.getElementById('logoutBtn').addEventListener('click',function(){nativeFetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+localStorage.getItem('medisyncToken')}}).finally(function(){localStorage.removeItem('medisyncToken');renderLogin()})});var names={users:'Team access',overview:'Overview',hospitals:'Hospital network',inventory:'Medicine inventory',addstock:'Add stock / hospital',forecast:'Demand forecast',shortages:'Shortage watch',expiry:'Expiry & FEFO',redistribution:'Redistribution',reorder:'Reorder planner',import:'Import data',simulation:'Scenario lab',audit:'Audit trail',blueprint:'Project blueprint'};var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};var nfmt=function(n){return Number(n||0).toLocaleString('en-IN')};var items=function(){return D?D.inventory:[]};var riskBadge=function(r){return '<span class="pill '+String(r).toLowerCase()+'">'+esc(r)+'</span>'};function toast(s){var t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(function(){t.style.display='none'},2400)}
function load(){if(!localStorage.getItem('medisyncToken')){renderLogin();return}document.getElementById('content').innerHTML='<div class="spinner"></div>';nativeFetch('/api/auth/me',{headers:{Authorization:'Bearer '+localStorage.getItem('medisyncToken')}}).then(function(r){if(!r.ok)throw Error('Please sign in again');return r.json()}).then(function(user){currentUser=user;applyRole();return Promise.all([fetch('/api/dashboard').then(function(r){if(!r.ok)throw Error();return r.json()}),fetch('/api/transfers').then(function(r){if(!r.ok)throw Error();return r.json()})])}).then(function(a){D=a[0];D.transfers=a[1];if(currentUser.role==='Admin')return fetch('/api/users').then(function(r){return r.json()}).then(function(users){D.users=users})}).then(function(){document.getElementById('riskCount').textContent=D.kpis.high_risk;render()}).catch(function(){localStorage.removeItem('medisyncToken');renderLogin()})}
function go(p){if(currentUser&&!(rolePages[currentUser.role]||[]).includes(p)){toast('Your role cannot open this section');return}page=p;document.getElementById('side').classList.remove('open');document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x.dataset.page===p)});document.getElementById('crumb').textContent=names[p];render();window.scrollTo(0,0)}document.getElementById('side').addEventListener('click',function(e){var b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.getElementById('menu').addEventListener('click',function(){document.getElementById('side').classList.toggle('open')});document.getElementById('refresh').addEventListener('click',load);document.getElementById('globalSearch').addEventListener('input',function(e){query=e.target.value.toLowerCase();if(page==='inventory')render()});document.getElementById('content').addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='goto')go(b.dataset.page);if(b.dataset.action==='export')exportCsv();if(b.dataset.action==='sample')sampleCsv();if(b.dataset.action==='open-movement')openMovement(Number(b.dataset.id));if(b.dataset.action==='request-transfer')requestTransfer(Number(b.dataset.donor),Number(b.dataset.to),Number(b.dataset.qty));if(b.dataset.action==='transfer-approve')transferAction(Number(b.dataset.id),'approve');if(b.dataset.action==='transfer-reject')transferAction(Number(b.dataset.id),'reject');if(b.dataset.action==='transfer-complete')transferAction(Number(b.dataset.id),'complete');if(b.dataset.action==='hospital'){query=String(b.dataset.name||'').toLowerCase();go('inventory')}});
function head(k,t,d,a){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div><div class="actions">'+(a||'')+'</div></div>'}function panel(t,s,body,r){return '<section class="panel"><div class="panelhead"><div><h2 class="ptitle">'+t+'</h2><div class="psub">'+s+'</div></div>'+(r||'')+'</div>'+body+'</section>'}function kpi(t,v,d,i,cl){return '<div class="card"><div class="cardtop"><div class="label">'+t+'</div><div class="mini">'+i+'</div></div><div class="big '+(cl||'')+'">'+v+'</div><div class="delta">'+d+'</div></div>'}function line(x){return '<tr><td><b>'+esc(x.medicine)+'</b><span class="subcell">'+esc(x.category)+' · '+esc(x.batch_code)+'</span></td><td>'+esc(x.hospital)+'<span class="subcell">'+esc(x.city)+'</span></td><td><b>'+nfmt(x.quantity)+'</b> '+esc(x.unit)+'</td><td>'+nfmt(x.forecast_30d)+'</td><td>'+(x.days_of_cover===999?'—':x.days_of_cover+' d')+'</td><td>'+x.expiry_date+'</td><td>'+riskBadge(x.shortage_risk)+'</td><td><button class="btn tiny soft" data-action="open-movement" data-id="'+x.inventory_id+'">Update stock</button></td></tr>'}function table(a){return a.length?'<div class="tablewrap"><table><thead><tr><th>MEDICINE / BATCH</th><th>HOSPITAL</th><th>ON HAND</th><th>30D NEED</th><th>COVER</th><th>EXPIRY</th><th>RISK</th><th>ACTIONS</th></tr></thead><tbody>'+a.map(line).join('')+'</tbody></table></div>':'<div class="empty">No matching records.</div>'}function exportCsv(){var s='medicine,hospital,city,category,batch,quantity,unit,forecast_30d,cover_days,expiry,risk\n'+items().map(function(x){return [x.medicine,x.hospital,x.city,x.category,x.batch_code,x.quantity,x.unit,x.forecast_30d,x.days_of_cover,x.expiry_date,x.shortage_risk].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='medisync-network-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Report downloaded')}function sampleCsv(){var s='hospital,city,medicine,category,quantity,reorder_level,expiry_date\nDemo East Hospital,Bengaluru,Paracetamol 500mg,Analgesic,240,80,2027-12-31\nDemo East Hospital,Bengaluru,ORS Sachets,Essential care,90,100,2027-06-30\n';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='sample_inventory.csv';a.click();URL.revokeObjectURL(a.href)}
function cards(){var k=D.kpis;return '<div class="cards">'+kpi('Hospital network',k.hospitals,'Facilities reporting','▦')+kpi('Tracked medicines',k.medicines,'Across the network','✚')+kpi('High shortage risk',k.high_risk,'Review stock cover','!',k.high_risk?'danger':'')+kpi('Expiring in 30 days',k.expiring_30d,'Batch review needed','◷',k.expiring_30d?'warm':'')+kpi('Units on hand',nfmt(k.units_on_hand),'All tracked batches','▤')+'</div>'}
function overview(){var urgent=items().filter(function(x){return x.shortage_risk!=='Low'}).sort(function(a,b){return a.days_of_cover-b.days_of_cover}).slice(0,4),top=items().slice().sort(function(a,b){return a.days_of_cover-b.days_of_cover}).slice(0,6),max=Math.max.apply(null,items().map(function(x){return x.forecast_30d}).concat([1]));var bars=items().filter(function(x){return x.hospital_id===items()[0].hospital_id}).slice(0,6).map(function(x){return '<div class="baritem"><span>'+esc(x.medicine.split(' ')[0])+'</span><div class="track"><div class="fill '+(x.shortage_risk==='High'?'warn':'')+'" style="width:'+Math.max(4,100*x.forecast_30d/max)+'%"></div></div><b>'+nfmt(x.forecast_30d)+'</b></div>'}).join('');var alerts=urgent.length?urgent.map(function(x){return '<div class="riskrow"><div><b>'+esc(x.medicine)+'</b><small>'+esc(x.hospital)+' · '+(x.days_of_cover===999?'—':x.days_of_cover+' days cover')+'</small></div><div class="riskmeta"><strong>'+nfmt(x.quantity)+'</strong>'+riskBadge(x.shortage_risk)+'</div></div>'}).join(''):'<div class="empty">No watch-list items right now.</div>';return head('NETWORK CONTROL CENTER','Medicine availability at a glance','Monitor stock, demand, expiry, and safe redistribution across your hospitals.','<button class="btn ghost" data-action="export">↓ Export report</button><button class="btn" data-action="goto" data-page="simulation">Run a scenario</button>')+cards()+'<div class="cols">'+panel('Demand outlook','30-day baseline · '+esc(items()[0].hospital),'<div class="barlist">'+bars+'</div>','<span class="pill info">MODEL BASELINE</span>')+panel('Needs attention','Prioritized by estimated days of cover',alerts,'<button class="btn tiny ghost" data-action="goto" data-page="shortages">View all</button>')+'</div>'+panel('Network stock position','Lowest cover first · Synthetic sample data',table(top),'<button class="btn tiny ghost" data-action="goto" data-page="inventory">Open inventory</button>')+'<div class="footer">Sample data is synthetic. Forecasts and action suggestions require human review; this MVP does not transfer or reorder medicine automatically.</div>'}
function inventoryPage(){var a=items().filter(function(x){return (x.medicine+' '+x.hospital+' '+x.category+' '+x.batch_code).toLowerCase().includes(query)});return head('OPERATIONS','Medicine inventory','Search batches and review stock, demand, cover, expiry, and risk.','<button class="btn ghost" data-action="export">↓ Export CSV</button><button class="btn soft" data-action="goto" data-page="addstock">＋ Add stock</button><button class="btn" data-action="goto" data-page="import">↑ Import CSV</button>')+panel('Inventory ledger',a.length+' batch lines across the network','<div class="toolbar"><input class="control searchbox" id="invsearch" placeholder="Search medicine, hospital or batch" value="'+esc(query)+'"><select class="control" id="riskfilter"><option>All risk levels</option><option>High</option><option>Medium</option><option>Low</option></select><select class="control" id="hospitalfilter"><option>All hospitals</option>'+[...new Set(items().map(function(x){return x.hospital}))].map(function(h){return '<option>'+esc(h)+'</option>'}).join('')+'</select></div><div id="invtable">'+table(a)+'</div>','<span class="pill neutral">LIVE STOCK VIEW</span>')}
function hospitalsPage(){var h={};items().forEach(function(x){if(!h[x.hospital])h[x.hospital]={city:x.city,lines:0,units:0,high:0};h[x.hospital].lines++;h[x.hospital].units+=x.quantity;if(x.shortage_risk==='High')h[x.hospital].high++});return head('NETWORK','Hospital network','Compare tracked medicine availability across demo facilities.')+'<div class="cols3">'+Object.keys(h).map(function(k){var x=h[k];return '<div class="card"><div class="label">'+esc(x.city)+'</div><div class="big" style="font-size:17px">'+esc(k)+'</div><div class="delta">'+x.lines+' medicine lines · '+nfmt(x.units)+' units</div><p><span class="pill '+(x.high?'high':'low')+'">'+x.high+' high-risk lines</span></p><button class="btn tiny ghost" data-action="hospital" data-name="'+esc(k)+'">Review stock →</button></div>'}).join('')+'</div>'+panel('Facility stock','All facilities combined',table(items().slice().sort(function(a,b){return a.hospital.localeCompare(b.hospital)})))}
function forecastPage(){var a=items().slice().sort(function(x,y){return y.forecast_30d-x.forecast_30d}),max=Math.max.apply(null,a.map(function(x){return x.forecast_30d}).concat([1]));return head('INTELLIGENCE','Demand forecast','30-day demand baseline by medicine and hospital. This is a simple exploratory estimate.','<button class="btn ghost" data-action="export">↓ Export report</button>')+panel('Forecast by network line','Sorted by estimated 30-day demand','<div class="barlist">'+a.map(function(x){return '<div class="baritem" style="grid-template-columns:180px 1fr 48px"><span>'+esc(x.medicine)+'<small class="subcell">'+esc(x.hospital)+'</small></span><div class="track"><div class="fill" style="width:'+Math.max(4,100*x.forecast_30d/max)+'%"></div></div><b>'+nfmt(x.forecast_30d)+'</b></div>'}).join('')+'</div>','<span class="pill info">SCIKIT-LEARN TREND</span>')+panel('How the baseline works','Current MVP method','<div class="features"><div class="feature"><div class="mini">01</div><b>Consumption history</b><p>Uses 120 days of synthetic daily consumption by medicine and hospital.</p></div><div class="feature"><div class="mini">02</div><b>Trend estimate</b><p>A linear trend projects daily demand into a 30-day estimate.</p></div><div class="feature"><div class="mini">03</div><b>Risk comparison</b><p>Projected demand is compared with current stock and reorder level.</p></div></div>')+'<div class="infoBox">Real-data validation, accuracy metrics, confidence intervals, and seasonality are planned work. Do not use demo forecasts as real demand predictions.</div>'}
function shortagePage(){var a=items().filter(function(x){return x.shortage_risk!=='Low'}).sort(function(x,y){return x.days_of_cover-y.days_of_cover});return head('INTELLIGENCE','Shortage watch','Items with low days of cover or stock at/below their reorder threshold.','<button class="btn ghost" data-action="export">↓ Export CSV</button>')+'<div class="cards">'+kpi('High risk',a.filter(function(x){return x.shortage_risk==='High'}).length,'Estimated cover under 7 days','!', 'danger')+kpi('Watch list',a.filter(function(x){return x.shortage_risk==='Medium'}).length,'Below buffer or low cover','◉','warm')+kpi('Reorder suggestions',a.filter(function(x){return x.reorder_suggestion>0}).length,'Formula-based quantities','↗')+'</div>'+panel('At-risk medicine lines','Lowest estimated cover first','<div class="tablewrap"><table><thead><tr><th>MEDICINE</th><th>HOSPITAL</th><th>ON HAND</th><th>DAILY BASELINE</th><th>DAYS COVER</th><th>SUGGESTED TOP-UP</th><th>RISK</th></tr></thead><tbody>'+(a.length?a.map(function(x){return '<tr><td><b>'+esc(x.medicine)+'</b><span class="subcell">'+esc(x.category)+'</span></td><td>'+esc(x.hospital)+'</td><td>'+nfmt(x.quantity)+'</td><td>'+nfmt(x.daily_forecast)+'</td><td><b>'+(x.days_of_cover===999?'—':x.days_of_cover+' days')+'</b></td><td>'+nfmt(x.reorder_suggestion)+'</td><td>'+riskBadge(x.shortage_risk)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No shortages detected in this sample.</td></tr>')+'</tbody></table></div>')+'<div class="infoBox">Risk bands use estimated cover and reorder level. They are heuristic signals, not clinical advice.</div>'}
function expiryPage(){var a=items().slice().sort(function(x,y){return x.days_to_expiry-y.days_to_expiry});return head('INVENTORY SAFETY','Expiry & FEFO','Review batches by nearest expiry. FEFO means first-expiring batch is considered first.','<button class="btn ghost" data-action="export">↓ Export batch list</button>')+'<div class="cards">'+kpi('Expiring ≤ 30 days',a.filter(function(x){return x.days_to_expiry<=30}).length,'Review these batches','◷','warm')+kpi('Expiring ≤ 90 days',a.filter(function(x){return x.days_to_expiry<=90}).length,'Upcoming review window','◷')+kpi('Expired batches',a.filter(function(x){return x.days_to_expiry<0}).length,'Check before any use','!','danger')+'</div>'+panel('FEFO batch queue',a.length+' batches · soonest expiry first','<div class="tablewrap"><table><thead><tr><th>EXPIRY</th><th>MEDICINE / BATCH</th><th>HOSPITAL</th><th>QUANTITY</th><th>TIME REMAINING</th><th>STOCK RISK</th></tr></thead><tbody>'+a.map(function(x){return '<tr><td><b>'+x.expiry_date+'</b></td><td>'+esc(x.medicine)+'<span class="subcell">'+esc(x.batch_code)+'</span></td><td>'+esc(x.hospital)+'</td><td>'+nfmt(x.quantity)+' '+esc(x.unit)+'</td><td><span class="pill '+(x.days_to_expiry<=30?'high':x.days_to_expiry<=90?'medium':'low')+'">'+(x.days_to_expiry<0?Math.abs(x.days_to_expiry)+' days past':x.days_to_expiry+' days')+'</span></td><td>'+riskBadge(x.shortage_risk)+'</td></tr>'}).join('')+'</tbody></table></div>')+'<div class="infoBox">Expiry checks and FEFO ordering are advisory. The MVP does not record physical picking or execute transfers.</div>'}
function redistributionPage(){var a=D.redistribution||[],requests=D.transfers||[];var candidates=a.length?a.map(function(x){return '<tr><td><b>'+esc(x.medicine)+'</b></td><td>'+esc(x.from_hospital)+'</td><td>'+esc(x.to_hospital)+'</td><td><b>'+nfmt(x.suggested_quantity)+'</b></td><td>'+nfmt(x.donor_stock_after)+'</td><td>'+esc(x.expires)+'</td><td><button class="btn tiny soft" data-action="request-transfer" data-donor="'+x.donor_inventory_id+'" data-to="'+x.to_hospital_id+'" data-qty="'+x.suggested_quantity+'">Request review</button></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No safe transfer candidates.</td></tr>';var queued=requests.length?requests.map(function(x){var action=x.status==='Requested'?'<button class="btn tiny" data-action="transfer-approve" data-id="'+x.id+'">Approve</button> <button class="btn tiny ghost" data-action="transfer-reject" data-id="'+x.id+'">Reject</button>':x.status==='Approved'?'<button class="btn tiny" data-action="transfer-complete" data-id="'+x.id+'">Complete transfer</button>':'—';return '<tr><td><b>#'+x.id+' · '+esc(x.medicine)+'</b><span class="subcell">Batch '+esc(x.batch_code)+'</span></td><td>'+esc(x.from_hospital)+'</td><td>'+esc(x.to_hospital)+'</td><td>'+nfmt(x.quantity)+'</td><td>'+esc(x.expiry_date)+'</td><td><span class="pill '+(x.status==='Completed'?'low':x.status==='Rejected'?'high':x.status==='Approved'?'info':'medium')+'">'+esc(x.status)+'</span></td><td>'+action+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No transfer requests yet. Request review on a suggested move above.</td></tr>';return head('NETWORK ACTIONS','Redistribution','Request a transfer, review it, then complete it to update both hospitals’ stock.','<button class="btn ghost" data-action="export">↓ Export report</button>')+panel('Safe surplus candidates','Suggestions respect donor safety buffer and estimated receiving need','<div class="tablewrap"><table><thead><tr><th>MEDICINE</th><th>FROM</th><th>TO</th><th>MOVE</th><th>DONOR AFTER</th><th>EXPIRY</th><th>REVIEW</th></tr></thead><tbody>'+candidates+'</tbody></table></div>')+panel('Transfer review queue','Role-aware review · Managers and Admins approve or reject; Pharmacists may request','<div class="tablewrap"><table><thead><tr><th>REQUEST</th><th>FROM</th><th>TO</th><th>QTY</th><th>EXPIRY</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>'+queued+'</tbody></table></div>')+'<div class="infoBox">Completing a transfer deducts the donor batch and creates a receiver batch with the same expiry date. The app checks the safety buffer again before completion. Admin and Hospital Manager accounts can approve or reject; Pharmacists can request; Auditors can view only.</div>'}
function reorderPage(){var a=items().filter(function(x){return x.reorder_suggestion>0}).sort(function(x,y){return y.reorder_suggestion-x.reorder_suggestion});return head('NETWORK ACTIONS','Reorder planner','Suggested top-ups based on estimated 30-day demand plus a 20% buffer.','<button class="btn ghost" data-action="export">↓ Export CSV</button>')+panel('Suggested replenishment',a.length+' medicine lines with a top-up estimate','<div class="tablewrap"><table><thead><tr><th>MEDICINE</th><th>HOSPITAL</th><th>ON HAND</th><th>30D NEED</th><th>REORDER LEVEL</th><th>SUGGESTED QTY</th><th>EXPIRY</th></tr></thead><tbody>'+a.map(function(x){return '<tr><td><b>'+esc(x.medicine)+'</b><span class="subcell">'+esc(x.category)+'</span></td><td>'+esc(x.hospital)+'</td><td>'+nfmt(x.quantity)+'</td><td>'+nfmt(x.forecast_30d)+'</td><td>'+nfmt(x.reorder_level)+'</td><td><span class="pill info">'+nfmt(x.reorder_suggestion)+'</span></td><td>'+x.expiry_date+'</td></tr>'}).join('')+'</tbody></table></div>')+'<div class="infoBox">Formula: max(0, 1.2 × estimated 30-day demand − current stock). Supplier lead time, pending orders, minimum order and budget are not included.</div>'}
function importPage(){return head('DATA OPERATIONS','Import inventory','Upload CSV batches into the local database. Existing inventory rows are not overwritten.','<button class="btn ghost" data-action="sample">↓ Download sample CSV</button>')+'<div class="notice" id="notice"></div>'+panel('Inventory CSV','CSV only · up to 5 MB and 5,000 rows','<div class="drop"><div style="font-size:22px;color:var(--teal)">⇧</div><b>Choose your inventory CSV</b><small>Required columns: hospital, city, medicine, category, quantity, reorder_level, expiry_date</small><input type="file" id="csvfile" accept=".csv,text/csv" class="control"><p style="font-size:8px;color:#8c9a9e">Dates must be YYYY-MM-DD. Quantities cannot be negative.</p><button class="btn" id="uploadBtn">Import batches</button></div>')+panel('Import checklist','Review these items before uploading','<div class="features"><div class="feature"><b>1 · Check headers</b><p>Use the required column names. Capitalization is flexible.</p></div><div class="feature"><b>2 · Validate values</b><p>Use ISO dates and non-negative quantities and reorder levels.</p></div><div class="feature"><b>3 · Review activity</b><p>Imported rows appear in inventory and the audit trail.</p></div></div>')}
function addStockPage(){return head('OPERATIONS','Add stock / register hospital','Enter a medicine batch directly. A new hospital or medicine is created automatically when the name is new.')+panel('New inventory batch','This adds a separate batch record; it does not overwrite existing stock.','<div id="stockNotice" class="notice"></div><form id="stockForm"><div class="gridform"><div class="field"><label>Hospital name *</label><input class="control" name="hospital" required maxlength="120" placeholder="e.g. Hyderabad General Hospital"></div><div class="field"><label>City *</label><input class="control" name="city" required maxlength="80" placeholder="e.g. Hyderabad"></div><div class="field"><label>Medicine name *</label><input class="control" name="medicine" required maxlength="120" placeholder="e.g. Paracetamol 500mg"></div><div class="field"><label>Category *</label><input class="control" name="category" required maxlength="80" placeholder="e.g. Analgesic"></div><div class="field"><label>Unit</label><select class="control" name="unit"><option>packs</option><option>tablets</option><option>vials</option><option>bottles</option><option>units</option></select></div><div class="field"><label>Batch code (optional)</label><input class="control" name="batch_code" maxlength="50" placeholder="Auto-generated if blank"></div><div class="field"><label>Quantity in stock *</label><input class="control" name="quantity" type="number" min="0" step="1" required placeholder="e.g. 150"></div><div class="field"><label>Reorder level *</label><input class="control" name="reorder_level" type="number" min="0" step="1" required placeholder="e.g. 60"></div><div class="field"><label>Expiry date *</label><input class="control" name="expiry_date" type="date" required></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="stockSubmit" type="submit">Save stock batch</button><button class="btn ghost" type="reset">Clear form</button></div></form>')+'<div class="infoBox">Add one batch at a time. To add more medicines at the same hospital, submit another batch and use the same hospital name and city.</div>'}
function simulationPage(){var opts=items().map(function(x){return '<option value="'+x.medicine_id+'|'+x.hospital_id+'">'+esc(x.medicine)+' — '+esc(x.hospital)+'</option>'}).join('');return head('DECISION SUPPORT','Scenario lab','Change demand or supply assumptions to explore a possible stock gap. Stock is not modified.')+panel('What-if simulation','Baseline estimate × horizon, adjusted by your scenario','<div class="gridform"><div class="field"><label>Medicine / hospital</label><select class="control" id="simItem">'+opts+'</select></div><div class="field"><label>Demand change (%)</label><input class="control" id="demand" type="number" value="20" min="-90" max="300"></div><div class="field"><label>Supply change (%)</label><input class="control" id="supply" type="number" value="0" min="-90" max="300"></div><div class="field"><label>Horizon</label><select class="control" id="horizon"><option value="30">30 days</option><option value="60">60 days</option><option value="90">90 days</option></select></div></div><button class="btn" id="simulateBtn">Run scenario</button><div class="result" id="result"></div>')+'<div class="infoBox">Scenario output is a planning estimate. Simulation is recorded in the audit trail but changes no medicine quantities.</div>'}
function auditPage(){return head('GOVERNANCE','Audit trail','Recent system events recorded in this local database.')+panel('Recent activity','Most recent entries first','<div class="tablewrap"><table><thead><tr><th>WHEN</th><th>EVENT</th><th>DETAIL</th></tr></thead><tbody>'+(D.audit.length?D.audit.map(function(x){return '<tr><td>'+new Date(x.created_at+'Z').toLocaleString()+'</td><td><span class="pill info">'+esc(x.action)+'</span></td><td style="white-space:normal;min-width:250px">'+esc(x.detail)+'</td></tr>'}).join(''):'<tr><td colspan="3" class="empty">No activity yet.</td></tr>')+'</tbody></table></div>')}
function blueprintPage(){var f=[['Inventory ledger','Batch stock, reorder levels, expiry and hospital medicine lines.','Working'],['Stock movements','Receive, issue, or correct counts; keep a before/after movement record.','Working'],['Demand baseline','Synthetic consumption history with a linear trend baseline.','Working'],['Shortage watch','Days-of-cover and reorder-level risk bands.','Working'],['Expiry & FEFO','Expiry review and earliest-expiry candidate ordering.','Working'],['Redistribution','Request, review, approve/reject, and complete safe transfers.','Working'],['Reorder planner','Top-up estimates with a 20% demand buffer.','Working'],['CSV import','Inventory batch import, validation and audit entry.','Working'],['Scenario lab','Demand/supply what-if without stock mutation.','Working'],['Reports and audit','Browser CSV export and recent system activity.','Working'],['Model validation','Backtesting, accuracy metrics and calibration.','Planned'],['Role-based access','Sign-in, account creation and API-enforced roles; hospital scoping is not included.','Working'],['Supplier integration','Lead times, orders, budgets and procurement.','Planned']];return head('PROJECT OVERVIEW','MediSync system blueprint','A clear view of the working MVP and the next features for your project demonstration.')+panel('Data-to-decision flow','Current prototype workflow','<div class="blueprint">'+[['1 · Data','Inventory and consumption'],['2 · Forecast','Trend baseline'],['3 · Assess','Risk and expiry checks'],['4 · Recommend','Transfers and top-ups'],['5 · Review','Dashboard and audit']].map(function(x){return '<div class="step"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div>')+panel('Feature status','Working versus planned','<div class="features">'+f.map(function(x){return '<div class="feature"><div style="display:flex;justify-content:space-between;gap:5px"><b>'+esc(x[0])+'</b><span class="pill '+(x[2]==='Working'?'low':'neutral')+'">'+x[2]+'</span></div><p>'+esc(x[1])+'</p></div>'}).join('')+'</div>')+panel('Technology and demo notes','For project presentation','<div class="features"><div class="feature"><b>Backend</b><p>FastAPI and SQLAlchemy.</p></div><div class="feature"><b>Analytics</b><p>pandas, NumPy and scikit-learn.</p></div><div class="feature"><b>Storage</b><p>SQLite demo; MySQL 8 URL support.</p></div><div class="feature"><b>Frontend</b><p>Responsive web dashboard served by FastAPI.</p></div><div class="feature"><b>Data</b><p>Synthetic sample hospitals, stock and demand.</p></div><div class="feature"><b>Human review</b><p>No automatic procurement or stock transfers.</p></div></div>')}
function usersPage(){var users=(D.users||[]).map(function(u){return '<tr><td><b>'+esc(u.display_name)+'</b></td><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td>'+(u.active?'Active':'Inactive')+'</td></tr>'}).join('');return head('ACCESS CONTROL','Team access','Create named accounts for the four project roles. Permissions are checked by the API.')+panel('Add a team member','Use a unique username and a password of at least eight characters','<form id="userForm"><div class="gridform"><div class="field"><label>Display name</label><input class="control" name="display_name" required></div><div class="field"><label>Username</label><input class="control" name="username" required minlength="3"></div><div class="field"><label>Role</label><select class="control" name="role"><option>Hospital Manager</option><option>Pharmacist</option><option>Auditor</option><option>Admin</option></select></div><div class="field"><label>Initial password</label><input class="control" name="password" type="password" minlength="8" required></div></div><div class="formActions"><button class="btn" type="submit">Create account</button></div><div id="userNotice" class="notice"></div></form>')+panel('Accounts','Demonstration accounts and any accounts created by an administrator','<div class="tablewrap"><table><thead><tr><th>NAME</th><th>USERNAME</th><th>ROLE</th><th>STATUS</th></tr></thead><tbody>'+users+'</tbody></table></div>')+'<div class="infoBox">This MVP has no hospital-by-hospital account scoping. Managers can manage the demo network. Change the demonstration passwords before using non-synthetic data.</div>'}
document.getElementById('content').addEventListener('submit',async function(e){if(e.target.id!=='userForm')return;e.preventDefault();var f=new FormData(e.target);var n=document.getElementById('userNotice');try{var r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:f.get('display_name'),username:f.get('username'),role:f.get('role'),password:f.get('password')})});var j=await r.json();if(!r.ok)throw Error(j.detail||'Could not create account');n.className='notice ok';n.textContent='Account created';load()}catch(err){n.className='notice err';n.textContent=err.message}});
function render(){if(!D)return;var v={overview:overview,hospitals:hospitalsPage,inventory:inventoryPage,addstock:addStockPage,forecast:forecastPage,shortages:shortagePage,expiry:expiryPage,redistribution:redistributionPage,reorder:reorderPage,import:importPage,simulation:simulationPage,audit:auditPage,users:usersPage,blueprint:blueprintPage};document.getElementById('content').innerHTML=(v[page]||overview)();if(currentUser.role==='Auditor')document.querySelectorAll('[data-action=open-movement],[data-action=request-transfer],[data-action=transfer-approve],[data-action=transfer-reject],[data-action=transfer-complete]').forEach(function(x){x.remove()});if(currentUser.role==='Pharmacist')document.querySelectorAll('[data-action=transfer-approve],[data-action=transfer-reject],[data-action=transfer-complete]').forEach(function(x){x.remove()});bind()}
function bind(){var s=document.getElementById('invsearch');if(s)s.addEventListener('input',function(){query=s.value.toLowerCase();filterInventory()});['riskfilter','hospitalfilter'].forEach(function(id){var x=document.getElementById(id);if(x)x.addEventListener('change',filterInventory)});var sim=document.getElementById('simulateBtn');if(sim)sim.addEventListener('click',runSimulation);var up=document.getElementById('uploadBtn');if(up)up.addEventListener('click',upload);var sf=document.getElementById('stockForm');if(sf)sf.addEventListener('submit',saveStock);if(!window.movementControlsBound){window.movementControlsBound=true;var mf=document.getElementById('movementForm');if(mf)mf.addEventListener('submit',saveMovement);['closeMove','cancelMove'].forEach(function(id){var c=document.getElementById(id);if(c)c.addEventListener('click',closeMovement)});var mt=document.getElementById('moveType');if(mt)mt.addEventListener('change',function(){var set=mt.value==='set';document.getElementById('moveQtyLabel').textContent=set?'New on-hand quantity':mt.value==='issued'?'Quantity issued':'Quantity received';document.getElementById('moveQuantity').min=set?'0':'1'})}}function filterInventory(){var r=document.getElementById('riskfilter'),h=document.getElementById('hospitalfilter');var a=items().filter(function(x){return (x.medicine+' '+x.hospital+' '+x.category+' '+x.batch_code).toLowerCase().includes(query)&&(!r||r.value==='All risk levels'||x.shortage_risk===r.value)&&(!h||h.value==='All hospitals'||x.hospital===h.value)});var t=document.getElementById('invtable');if(t)t.innerHTML=table(a)}
function openMovement(id){var x=items().find(function(v){return v.inventory_id===id});if(!x)return;document.getElementById('moveInventoryId').value=id;document.getElementById('moveSummary').textContent=x.medicine+' · '+x.hospital+' · batch '+x.batch_code+' · current quantity '+x.quantity+' '+x.unit;document.getElementById('moveType').value='received';document.getElementById('moveQuantity').value='';document.getElementById('moveQuantity').min='1';document.getElementById('moveQtyLabel').textContent='Quantity received';document.getElementById('moveReason').value='';document.getElementById('moveError').style.display='none';document.getElementById('moveDialog').showModal()}function closeMovement(){document.getElementById('moveDialog').close()}function saveMovement(e){e.preventDefault();var id=Number(document.getElementById('moveInventoryId').value),type=document.getElementById('moveType').value,qty=Number(document.getElementById('moveQuantity').value),reason=document.getElementById('moveReason').value;var b=document.getElementById('saveMove'),err=document.getElementById('moveError');b.disabled=true;b.textContent='Saving…';fetch('/api/inventory/'+id+'/movement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({movement_type:type,quantity:qty,reason:reason})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.detail||'Could not update stock');return x})}).then(function(x){closeMovement();toast('Stock updated: '+x.quantity_before+' → '+x.quantity_after);load()}).catch(function(e){err.textContent=e.message;err.className='notice err';b.disabled=false;b.textContent='Save movement'})}function requestTransfer(donor,to,qty){if(!confirm('Request review for a transfer of '+nfmt(qty)+' units? This will not move stock until approved and completed.'))return;fetch('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donor_inventory_id:donor,to_hospital_id:to,quantity:qty})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.detail||'Could not create transfer request');return x})}).then(function(){toast('Transfer added to review queue');load()}).catch(function(e){toast(e.message)})}function transferAction(id,action){var labels={approve:'Approve this transfer request?',reject:'Reject this transfer request?',complete:'Complete this transfer and update stock at both hospitals?'};if(!confirm(labels[action]))return;fetch('/api/transfers/'+id+'/'+action,{method:'POST'}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.detail||'Transfer action failed');return x})}).then(function(){toast('Transfer '+({approve:'approved',reject:'rejected',complete:'completed'}[action]||action));load()}).catch(function(e){toast(e.message)})}
function runSimulation(){var v=document.getElementById('simItem').value.split('|');fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({medicine_id:Number(v[0]),hospital_id:Number(v[1]),demand_change_pct:Number(document.getElementById('demand').value),supply_change_pct:Number(document.getElementById('supply').value),horizon_days:Number(document.getElementById('horizon').value)})}).then(function(r){return r.json()}).then(function(x){var b=document.getElementById('result');b.style.display='block';b.innerHTML='<strong>'+esc(x.status)+'</strong><br>'+esc(x.medicine)+' at '+esc(x.hospital)+' · '+x.horizon_days+' days<br>Estimated demand: <b>'+nfmt(x.projected_demand)+'</b> · Adjusted stock: <b>'+nfmt(x.adjusted_stock)+'</b> · Projected gap: <b>'+nfmt(x.projected_gap)+'</b><br><small>'+esc(x.note)+'</small>';load()}).catch(function(){toast('Simulation failed. Check the local API.')})}
function saveStock(e){e.preventDefault();var form=e.target,button=document.getElementById('stockSubmit'),notice=document.getElementById('stockNotice'),body={};new FormData(form).forEach(function(v,k){body[k]=v});body.quantity=Number(body.quantity);body.reorder_level=Number(body.reorder_level);button.disabled=true;button.textContent='Saving…';fetch('/api/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.detail||'Could not save stock');return x})}).then(function(x){notice.className='notice ok';notice.textContent='Saved '+x.medicine+' at '+x.hospital+' · batch '+x.batch_code+'. Opening inventory…';toast('Stock batch added');return fetch('/api/dashboard').then(function(r){return r.json()})}).then(function(d){D=d;document.getElementById('riskCount').textContent=D.kpis.high_risk;query='';go('inventory')}).catch(function(err){notice.className='notice err';notice.textContent=err.message;button.disabled=false;button.textContent='Save stock batch'})}
function upload(){var f=document.getElementById('csvfile').files[0],n=document.getElementById('notice'),b=document.getElementById('uploadBtn');if(!f){n.className='notice err';n.textContent='Choose a CSV file first.';return}var d=new FormData();d.append('file',f);b.disabled=true;b.textContent='Importing…';fetch('/api/import/csv',{method:'POST',body:d}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.detail||'Import failed');return x})}).then(function(x){n.className='notice ok';n.textContent='Imported '+x.imported+' inventory row(s). Refreshing…';b.disabled=false;b.textContent='Import batches';toast('Inventory CSV imported');load()}).catch(function(e){n.className='notice err';n.textContent=e.message;b.disabled=false;b.textContent='Import batches'})}
load();
</script></body></html>
